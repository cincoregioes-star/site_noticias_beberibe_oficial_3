    <text x="0" y="375" font-family="Arial" font-size="31" font-weight="700" fill="#d6e8ee">Organize revisão, simulados e redação</text>
  </g>
  <g transform="translate(130 530)">
    <rect width="610" height="235" rx="44" fill="#071827" stroke="#58efbc" stroke-width="4"/>
    <text x="305" y="75" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#d6e8ee">1º DIA DE PROVA</text>
    <text x="305" y="165" text-anchor="middle" font-family="Arial" font-size="68" font-weight="900" fill="#fff">8 DE NOVEMBRO</text>
  </g>
  <g transform="translate(860 530)">
    <rect width="610" height="235" rx="44" fill="#071827" stroke="#e7b541" stroke-width="4"/>
    <text x="305" y="75" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#d6e8ee">2º DIA DE PROVA</text>
    <text x="305" y="165" text-anchor="middle" font-family="Arial" font-size="68" font-weight="900" fill="#fff">15 DE NOVEMBRO</text>
