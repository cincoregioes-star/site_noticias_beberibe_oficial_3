<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Cronograma ENEM 2026</title>
  <desc id="d">Arte informativa sobre as provas de 8 e 15 de novembro.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031427"/><stop offset=".48" stop-color="#083a64"/><stop offset="1" stop-color="#096a58"/></linearGradient><radialGradient id="r"><stop stop-color="#18dca0" stop-opacity=".55"/><stop offset="1" stop-color="#18dca0" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="140" r="420" fill="url(#r)"/>
  <g transform="translate(100 90)">
    <text x="0" y="90" font-family="Arial" font-size="62" font-weight="900" fill="#fff">ENEM</text>
    <text x="245" y="90" font-family="Arial" font-size="62" font-weight="900" fill="#e7b541">2026</text>
    <text x="0" y="180" font-family="Arial" font-size="84" font-weight="900" fill="#fff">PROVAS EM</text>
