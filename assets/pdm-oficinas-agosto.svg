        <rect width="300" height="150" rx="24" fill="#0c3443"/><text x="28" y="50" fill="#56efba" font-size="27" font-weight="800">12 AGO</text><text x="28" y="92" fill="#fff" font-size="24" font-weight="700">Câmara Municipal</text><text x="28" y="127" fill="#b8d1d7" font-size="20">9h audiência • 13h30 oficina</text>
        <rect x="330" width="300" height="150" rx="24" fill="#0c3443"/><text x="358" y="50" fill="#e7b541" font-size="27" font-weight="800">13 AGO</text><text x="358" y="92" fill="#fff" font-size="24" font-weight="700">Parajuru e Paripueira</text><text x="358" y="127" fill="#b8d1d7" font-size="20">9h30 • 13h30</text>
        <rect x="660" width="300" height="150" rx="24" fill="#0c3443"/><text x="688" y="50" fill="#49cfe6" font-size="27" font-weight="800">14 AGO</text><text x="688" y="92" fill="#fff" font-size="24" font-weight="700">Sucatinga e Itapeim</text><text x="688" y="127" fill="#b8d1d7" font-size="20">9h30 • 13h30</text>
        <rect x="990" width="300" height="150" rx="24" fill="#0c3443"/><text x="1018" y="50" fill="#ffb06d" font-size="27" font-weight="800">15 AGO</text><text x="1018" y="92" fill="#fff" font-size="24" font-weight="700">Serra do Félix e Forquilha</text><text x="1018" y="127" fill="#b8d1d7" font-size="20">9h30 • 13h30</text>
