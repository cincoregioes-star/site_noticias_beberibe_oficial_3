      <text x="42" y="270" fill="#fff" font-size="32" font-weight="800">Leve suas demandas, propostas e conhecimento do território.</text>
      <text x="42" y="325" fill="#b8d1d7" font-size="25">Programação oficial da Prefeitura de Beberibe • Confira eventuais atualizações na fonte.</text>
      <text x="42" y="385" fill="#56efba" font-size="24" font-weight="800">BEberibe notícias • 24.07.2026</text>
