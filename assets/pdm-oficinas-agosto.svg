<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Audiência pública e oficinas do Plano Diretor de Beberibe</title>
  <desc id="desc">Agenda oficial de 12 a 15 de agosto de 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082839"/><stop offset="1" stop-color="#094d45"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="300" fill="#49cfe6" opacity=".10"/>
  <path d="M0 650C330 570 500 760 830 655s500-95 770-10v255H0Z" fill="#03101a" opacity=".58"/>
  <g transform="translate(85 72)" font-family="Arial, sans-serif">
    <text x="0" y="48" fill="#56efba" font-size="32" font-weight="800" letter-spacing="4">PLANO DIRETOR MUNICIPAL</text>
    <text x="0" y="145" fill="#fff" font-size="76" font-weight="900">Audiência e oficinas</text>
    <text x="0" y="205" fill="#bdd2d7" font-size="33">Participe da revisão que orientará o futuro de Beberibe.</text>
    <g transform="translate(0 270)" filter="url(#shadow)">
      <rect width="1430" height="430" rx="38" fill="#061b28" stroke="#56efba" stroke-opacity=".28"/>
