<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pesquisa Gerp de julho de 2026</title>
  <desc id="desc">Flávio Bolsonaro 35 por cento e Lula 34 por cento no primeiro turno, dentro da margem de erro.</desc>
  <rect width="1600" height="900" fill="#061722"/>
  <circle cx="1360" cy="130" r="310" fill="#49cfe6" opacity=".08"/>
  <g font-family="Arial, sans-serif" transform="translate(100 85)">
    <text x="0" y="48" fill="#56efba" font-size="31" font-weight="800" letter-spacing="4">ELEIÇÕES 2026 • PESQUISA GERP</text>
    <text x="0" y="138" fill="#fff" font-size="66" font-weight="900">Cenário presidencial em julho</text>
    <text x="0" y="195" fill="#aac4cb" font-size="29">Primeiro turno • números divulgados em 22/07/2026</text>
    <g transform="translate(0 265)">
      <text x="0" y="55" fill="#fff" font-size="34" font-weight="800">Flávio Bolsonaro</text>
      <rect x="370" y="0" width="840" height="74" rx="37" fill="#102f40"/>
      <rect x="370" y="0" width="735" height="74" rx="37" fill="#49cfe6"/>
      <text x="1245" y="55" fill="#fff" font-size="54" font-weight="900">35%</text>
      <text x="0" y="175" fill="#fff" font-size="34" font-weight="800">Lula</text>
      <rect x="370" y="120" width="840" height="74" rx="37" fill="#102f40"/>
      <rect x="370" y="120" width="714" height="74" rx="37" fill="#56efba"/>
      <text x="1245" y="175" fill="#fff" font-size="54" font-weight="900">34%</text>
    </g>
    <rect x="0" y="555" width="1390" height="126" rx="28" fill="#0d3040" stroke="#e7b541" stroke-opacity=".45"/>
    <text x="42" y="610" fill="#e7b541" font-size="31" font-weight="900">EMPATE TÉCNICO</text>
    <text x="42" y="654" fill="#c8d9dd" font-size="24">A diferença de um ponto não permite afirmar liderança estatística. Outras pesquisas apresentam números distintos.</text>
    <text x="0" y="748" fill="#8ba8b0" font-size="21">Pesquisa é fotografia do momento, não resultado da eleição. Consulte metodologia e registro na fonte.</text>
  </g>
</svg>
