<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Nova edição do Beberibe Notícias</title>
  <desc id="desc">Card para redes sociais com os destaques de 24 de julho de 2026.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#03101a" stop-opacity=".22"/>
      <stop offset=".42" stop-color="#03101a" stop-opacity=".58"/>
      <stop offset="1" stop-color="#020a11" stop-opacity=".98"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".5"/></filter>
  </defs>
  <image href="capa-edicao-24-07-2026.webp" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1350" fill="url(#shade)"/>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="65" y="62" width="158" height="158" rx="42" fill="#56efba"/>
    <text x="144" y="163" text-anchor="middle" fill="#03101a" font-size="72" font-weight="900">BN</text>
    <text x="255" y="125" fill="#fff" font-size="46" font-weight="900">BEBERIBE</text>
    <text x="255" y="175" fill="#56efba" font-size="42" font-weight="900">NOTÍCIAS</text>
    <rect x="65" y="320" width="402" height="58" rx="29" fill="#e7b541"/>
    <text x="266" y="360" text-anchor="middle" fill="#03101a" font-size="27" font-weight="900" letter-spacing="2">NOVA EDIÇÃO • 24/07</text>
    <text x="65" y="500" fill="#fff" font-size="78" font-weight="900">A cidade, a política</text>
    <text x="65" y="586" fill="#fff" font-size="78" font-weight="900">e a vida real.</text>
  </g>
  <g transform="translate(65 720)" font-family="Arial, sans-serif">
    <rect width="950" height="430" rx="45" fill="#04131f" fill-opacity=".93" stroke="#56efba" stroke-opacity=".33"/>
    <text x="42" y="72" fill="#56efba" font-size="29" font-weight="900">DESTAQUES</text>
    <text x="42" y="137" fill="#fff" font-size="34" font-weight="800">• 24 novos nomeados no concurso</text>
    <text x="42" y="196" fill="#fff" font-size="34" font-weight="800">• PDM: audiência e oficinas</text>
    <text x="42" y="255" fill="#fff" font-size="34" font-weight="800">• Saúde, educação e turismo</text>
    <text x="42" y="314" fill="#fff" font-size="34" font-weight="800">• Política, economia e agricultura</text>
    <text x="42" y="373" fill="#e7b541" font-size="30" font-weight="900">+ receitas, moda, gastronomia e crônica</text>
  </g>
  <text x="540" y="1255" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="800">@beberibe.noticiasoficial</text>
  <text x="540" y="1305" text-anchor="middle" fill="#b6ced3" font-family="Arial, sans-serif" font-size="24">Leia, compartilhe e acompanhe as fontes.</text>
</svg>
